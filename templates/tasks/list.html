{% extends 'base.html' %}
{% block title %}レシピ一覧{% endblock %}
{% block content %}    
    <h1>献立一覧</h1>
    <ul>
        {% for p in projects %}
            <li>{{ p.title }} - {{ p.scheduled_at }}</li>
        {% empty %}
            <li>まだ献立が登録されていません。</li>
        {% endfor %}
    </ul>
{% endblock %}
