{% load static %}

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ログイン | Cook Scheduler</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>

<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="{% static 'image/Icon.png' %}" alt="Cook Scheduler" class="auth-logo">
                <h1>ログイン</h1>

                <p>
                    おひさしぶりです
                </p>
            </div>

            <form method="post" class="auth-form">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="auth-button">
                    ログイン
                </button>
            </form>

            <div class="auth-footer">
                <span>アカウントをお持ちでないですか？</span>
                <a href="{% url 'accounts:signup' %}"> 新規登録 </a>
            </div>

        </div>
    </main>
</body>
</html>
