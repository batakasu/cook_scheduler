<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>工程</title>
    <style>
        /* 折りたたみ機能のデザイン */
        details {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
        }
        summary {
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }
        summary:hover {
            color: #007bff;
        }
        .step-content {
            margin-top: 10px;
            padding-left: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>工程</h1>
    {% for task in tasks %}
        <h2>{{ task.title }}</h2>
        
        <h3>ステップ</h3>
        {% for step in task.steps.all %}
            <details>
                <summary>{{ step.order }}. {{ step.description|truncatechars:20 }}</summary>
                    <div class="step-content">
                        <p>{{ step.description }}</p>
                    </div>
                </details>
        {% empty %}
            <p>まだステップが登録されていません。</p>
        {% endfor %}
        <hr>
    {% endfor %}
</body>
</html>
