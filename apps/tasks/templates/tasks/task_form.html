<h2>ステップを追加</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <h3>ステップ</h3>
    {{ formset.management_form }}
    {% for step_form in formset %}
        {{ step_form.as_p }}
    {% endfor %}
    <button type="submit">保存する</button>
</form>
<a href="{% url 'tasks:schedule' %}">キャンセル</a>
